<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Crawl | CineCrawl</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="crawl">
  <nav class="navbar">
    <a href="index.html" class="logo"><span class="logo-mark">CC</span><span>CineCrawl</span></a>
    <button class="icon-button nav-toggle" type="button" data-action="toggle-nav">Menu</button>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="crawl.html">The Crawl</a>
      <a href="chatrooms.html">CineRooms</a>
      <a href="results.html?mode=upcoming">Upcoming</a>
    </div>
    <div class="nav-tools">
      <div class="nav-search">
        <span class="search-icon">S</span>
        <input type="search" id="searchInput" placeholder="Search movies" autocomplete="off">
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <a href="profile.html" aria-label="Profile"><img id="navAvatar" class="avatar-link" src="" alt=""></a>
      <button class="btn-secondary" type="button" data-action="logout">Exit</button>
    </div>
  </nav>

  <main class="page-shell crawl-wrap">
    <section class="crawl-panel">
      <div class="stepper" aria-label="Crawl progress">
        <div class="step-dot active">1</div>
        <div class="step-line"></div>
        <div class="step-dot">2</div>
        <div class="step-line"></div>
        <div class="step-dot">3</div>
      </div>
      <span class="eyebrow">Mood scanner</span>
      <h1 class="page-title">Choose your <span>signal</span></h1>
      <p class="section-sub">Start with the emotional weather. The next step narrows the intensity.</p>
      <div class="mood-grid" id="moodGrid"></div>
    </section>
  </main>
</body>
</html>
